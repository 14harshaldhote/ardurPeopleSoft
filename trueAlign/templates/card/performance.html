<style>
  /* A more subtle glow effect */
  @keyframes pulse-glow {
    0%, 100% { box-shadow: 0 0 8px rgba(34, 197, 94, 0.4); }
    50% { box-shadow: 0 0 16px rgba(34, 197, 94, 0.7); }
  }
  .animate-pulse-glow {
    animation: pulse-glow 3s ease-in-out infinite;
  }
</style>

<div class="bg-white shadow-2xl rounded-2xl p-4 sm:p-6 md:p-8 transform transition-all duration-300 hover:scale-105 border border-gray-100">
  
  <div class="flex flex-col items-center">
    
    <div class="w-full flex justify-between items-center mb-4">
        <h3 class="text-lg font-semibold text-slate-800">Performance Overview</h3>
        <span class="bg-green-100 text-green-800 py-1 px-3 rounded-full text-xs font-semibold uppercase tracking-wide animate-pulse-glow">On Track</span>
    </div>

    <div class="relative w-full max-w-[280px] aspect-square">
      <canvas id="speedometer"></canvas>
      
      <div class="absolute top-1/2 left-1/2 -translate-x-1/2 -translate-y-[40%] text-center z-10">
        <p class="text-6xl font-bold m-0 transition-colors duration-500" id="percentage">0%</p>
        <p class="text-sm text-slate-500 uppercase tracking-widest -mt-1">Efficiency</p>
      </div>
    </div>

    <div class="w-full flex justify-between mt-6 gap-4">
      <div class="bg-slate-50/70 rounded-xl p-4 w-1/2 text-center border border-slate-200/80 transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-md">
        <p class="text-slate-600 text-xs mb-1 uppercase tracking-wider">Projects</p>
        <p class="text-2xl font-semibold m-0 text-slate-800" id="projects-completed">0</p>
      </div>
      <div class="bg-slate-50/70 rounded-xl p-4 w-1/2 text-center border border-slate-200/80 transition-all duration-300 ease-in-out hover:-translate-y-1 hover:shadow-md">
        <p class="text-slate-600 text-xs mb-1 uppercase tracking-wider">Goals Met</p>
        <p class="text-2xl font-semibold m-0 text-slate-800" id="goals-achieved">0</p>
      </div>
    </div>

    <div class="w-full mt-6">
      <div class="flex justify-between items-center mb-2">
        <h4 class="text-sm font-medium text-slate-700 m-0">Key Performance Index</h4>
        <span class="text-sm text-slate-500 font-semibold" id="kpi-points">0 points</span>
      </div>
      <div class="h-2 w-full bg-slate-200 rounded-full overflow-hidden">
        <div class="h-full rounded-full bg-gradient-to-r from-orange-400 via-green-500 to-teal-400 transition-all duration-1000 ease-out" id="kpi-progress" style="width: 0%;"></div>
      </div>
    </div>
  </div>
</div>


<script>
  // Change this value to set the percentage (0-100)
  const targetPercentage = 0; // Example: set to 75%
  
  const canvas = document.getElementById('speedometer');
  const ctx = canvas.getContext('2d');
  const percentageDisplay = document.getElementById('percentage');
  const kpiProgress = document.getElementById('kpi-progress');
  
  // Set KPI progress bar width
  kpiProgress.style.width = `${targetPercentage}%`;
  
  let currentPercentage = 0;
  let animationFrameId;
  
  // Convert percentage to radians for the gauge
  const percentageToRadians = (percentage) => {
    // Map percentage (0-100) to radians (0.75π to 2.25π)
    return (percentage / 100) * 1.5 * Math.PI + 0.75 * Math.PI;
  };
  
  // Calculate coordinates on a circle
  const getCircleCoordinates = (centerX, centerY, radius, angleRadians) => {
    return {
      x: centerX + radius * Math.cos(angleRadians),
      y: centerY + radius * Math.sin(angleRadians)
    };
  };
  
  // Get color based on percentage
  const getColor = (percentage) => {
    if (percentage <= 40) {
      return '#f97316'; // Orange
    } else if (percentage <= 75) {
      return '#22c55e'; // Green
    } else {
      return '#54cfe2'; // Slate
    }
  };
  
  // Draw the speedometer
  const drawSpeedometer = (percentage) => {
    const centerX = canvas.width / 2;
    const centerY = canvas.height / 2;
    const outerRadius = canvas.width / 2 - 10;
    const innerRadius = outerRadius - 20;
    
    // Clear canvas
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    
    // Draw outer ring (track)
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerRadius, 0.75 * Math.PI, 2.25 * Math.PI);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.2)';
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Draw progress arc with dynamic color
    ctx.beginPath();
    ctx.arc(centerX, centerY, outerRadius, 0.75 * Math.PI, percentageToRadians(percentage));
    ctx.strokeStyle = getColor(percentage);
    ctx.lineWidth = 8;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Draw inner ring (secondary track)
    ctx.beginPath();
    ctx.arc(centerX, centerY, innerRadius, 0.75 * Math.PI, 2.25 * Math.PI);
    ctx.strokeStyle = 'rgba(148, 163, 184, 0.1)';
    ctx.lineWidth = 1;
    ctx.stroke();
    
    // Draw ticks
    for (let i = 0; i <= 100; i += 10) {
      const angle = percentageToRadians(i);
      
      // Major ticks (every 20%)
      if (i % 20 === 0) {
        const outerPoint = getCircleCoordinates(centerX, centerY, outerRadius + 5, angle);
        const innerPoint = getCircleCoordinates(centerX, centerY, outerRadius - 12, angle);
        
        ctx.beginPath();
        ctx.moveTo(innerPoint.x, innerPoint.y);
        ctx.lineTo(outerPoint.x, outerPoint.y);
        ctx.strokeStyle = i <= percentage ? getColor(i) : 'rgba(148, 163, 184, 0.6)';
        ctx.lineWidth = 3;
        ctx.lineCap = 'round';
        ctx.stroke();
      } 
      // Minor ticks (every 10%)
      else if (i % 10 === 0) {
        const outerPoint = getCircleCoordinates(centerX, centerY, outerRadius, angle);
        const innerPoint = getCircleCoordinates(centerX, centerY, outerRadius - 8, angle);
        
        ctx.beginPath();
        ctx.moveTo(innerPoint.x, innerPoint.y);
        ctx.lineTo(outerPoint.x, outerPoint.y);
        ctx.strokeStyle = i <= percentage ? getColor(i) : 'rgba(148, 163, 184, 0.4)';
        ctx.lineWidth = 2;
        ctx.lineCap = 'round';
        ctx.stroke();
      }
    }
    
    // Draw needle
    const needleAngle = percentageToRadians(percentage);
    const needleLength = outerRadius - 40;
    const needlePoint = getCircleCoordinates(centerX, centerY, needleLength, needleAngle);
    
    // Draw needle shadow
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(needlePoint.x, needlePoint.y);
    ctx.shadowColor = 'rgba(0, 0, 0, 0.5)';
    ctx.shadowBlur = 5;
    ctx.shadowOffsetX = 2;
    ctx.shadowOffsetY = 2;
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    ctx.shadowColor = 'transparent';
    
    // Draw needle
    ctx.beginPath();
    ctx.moveTo(centerX, centerY);
    ctx.lineTo(needlePoint.x, needlePoint.y);
    ctx.strokeStyle = getColor(percentage);
    ctx.lineWidth = 3;
    ctx.lineCap = 'round';
    ctx.stroke();
    
    // Draw center hub
    ctx.beginPath();
    ctx.arc(centerX, centerY, 15, 0, 2 * Math.PI);
    ctx.fillStyle = '#1e293b';
    ctx.fill();
    ctx.strokeStyle = '#ffffff';
    ctx.lineWidth = 2;
    ctx.stroke();
    
    // Add glow to center hub
    ctx.beginPath();
    ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
    const hubGradient = ctx.createRadialGradient(
      centerX, centerY, 0,
      centerX, centerY, 8
    );
    hubGradient.addColorStop(0, getColor(percentage));
    hubGradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
    ctx.fillStyle = hubGradient;
    ctx.fill();
  };
  
  // Animate the speedometer
  const animateSpeedometer = () => {
    if (currentPercentage < targetPercentage) {
      currentPercentage += 1;
      percentageDisplay.textContent = `${currentPercentage}%`;
      drawSpeedometer(currentPercentage);
      animationFrameId = requestAnimationFrame(animateSpeedometer);
    } else {
      percentageDisplay.textContent = `${targetPercentage}%`;
      drawSpeedometer(targetPercentage);
    }
  };
  
  // Start animation after a short delay
  setTimeout(() => {
    animateSpeedometer();
  }, 500);
</script>
