{% extends 'base.html' %}
{% block title %}Password Reset Complete - TrueAlign Portal{% endblock %}

{% block content %}
<div class="min-h-screen bg-zinc-50 flex items-center justify-center py-8 px-4">
    <div class="max-w-md w-full">
        <div class="glass-panel p-8 text-center">
            <div
                class="mx-auto flex items-center justify-center h-16 w-16 rounded-full bg-gradient-to-br from-emerald-100 to-emerald-200 mb-6">
                <svg class="h-10 w-10 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                </svg>
            </div>

            <h2 class="text-2xl font-bold text-zinc-900 mb-4">Password Reset Successful!</h2>

            <p class="text-zinc-600 mb-8">
                Your password has been successfully reset. You can now log in with your new password.
            </p>

            <a href="{% url 'login' %}" class="btn btn-violet inline-flex">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M11 16l-4-4m0 0l4-4m-4 4h14m-5 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h7a3 3 0 013 3v1">
                    </path>
                </svg>
                Go to Login
            </a>
        </div>
    </div>
</div>
{% endblock %}
