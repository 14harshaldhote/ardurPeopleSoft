{% extends 'base.html' %}
{% load static %}

{% block title %}Bulk Upload Users{% endblock %}

{% block content %}
<div class="container mx-auto px-4 py-6">
    <div class="flex justify-between items-center mb-6">
        <h1 class="text-3xl font-bold text-gray-900">Bulk Upload Users</h1>
        <a href="{% url 'profile:user-list' %}" class="bg-gray-600 hover:bg-gray-700 text-white px-4 py-2 rounded-lg transition duration-200">
            <i class="fas fa-arrow-left mr-2"></i>Back to List
        </a>
    </div>

    <div class="bg-white rounded-lg shadow-sm p-6">
        <form method="post" enctype="multipart/form-data">
            {% csrf_token %}
            <div class="flex justify-between items-center mb-4">
                <label class="block text-sm font-medium text-gray-700 mr-4">Select CSV File:</label>
                <input type="file" name="csv_file" class="border border-gray-300 rounded-md focus:outline-none focus:ring-2 focus:ring-blue-500">
                {% if form.csv_file.errors %}
                    <p class="mt-1 text-sm text-red-600">{{ form.csv_file.errors.0 }}</p>
                {% endif %}
            </div>
            <button type="submit" class="bg-blue-600 hover:bg-blue-700 text-white px-6 py-2 rounded-md transition duration-200">
                <i class="fas fa-upload mr-2"></i>Upload
            </button>
        </form>
    </div>
</div>
{% endblock %}
