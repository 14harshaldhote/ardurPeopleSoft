{% extends "base.html" %}

{% block page_title %}Create Assignment{% endblock %}

{% block content %}
<div class="min-h-screen bg-zinc-50">
    <div class="bg-white shadow-sm border-b border-gray-200">
        <div class="max-w-7xl mx-auto px-4 py-6">
            <div class="flex items-center justify-between">
                <div class="flex items-center space-x-4">
                    <div
                        class="w-12 h-12 bg-gradient-to-r from-emerald-500 to-emerald-600 rounded-xl flex items-center justify-center">
                        <svg class="w-7 h-7 text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24"
                            stroke-width="2">
                            <path stroke-linecap="round" stroke-linejoin="round" d="M12 6v6m0 0v6m0-6h6m-6 0H6" />
                        </svg>
                    </div>
                    <div>
                        <h1 class="text-3xl font-bold text-zinc-900">Create Assignment</h1>
                        <p class="text-zinc-600">Assign employee to shift</p>
                    </div>
                </div>
                <a href="{% url 'shift:assignment_list' %}" class="btn btn-secondary">Back</a>
            </div>
        </div>
    </div>

    <div class="max-w-3xl mx-auto px-4 py-8">
        <div class="glass-panel overflow-hidden">
            <div class="px-8 py-6 bg-gradient-to-r from-emerald-50 to-green-50 border-b border-emerald-100">
                <h3 class="text-xl font-semibold text-zinc-900">Assignment Configuration</h3>
                <p class="text-sm text-zinc-600">Assign an employee to a shift pattern</p>
            </div>

            <form method="post" class="px-6 py-4 space-y-6">
                {% csrf_token %}

                <div>
                    <label for="user" class="block text-sm font-medium text-zinc-700">Employee</label>
                    <select name="user" id="user" required class="form-select">
                        <option value="">Select Employee</option>
                        {% for user in users %}
                        <option value="{{ user.id }}">{{ user.get_full_name|default:user.username }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div>
                    <label for="shift" class="block text-sm font-medium text-zinc-700">Shift</label>
                    <select name="shift" id="shift" required class="form-select">
                        <option value="">Select Shift</option>
                        {% for shift in shifts %}
                        <option value="{{ shift.id }}">{{ shift.name }} ({{ shift.start_time|time:"H:i" }} - {{
                            shift.end_time|time:"H:i" }})</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                    <div>
                        <label for="effective_from" class="block text-sm font-medium text-zinc-700">Start Date</label>
                        <input type="date" name="effective_from" id="effective_from" required class="form-input">
                    </div>
                    <div>
                        <label for="effective_to" class="block text-sm font-medium text-zinc-700">End Date
                            (Optional)</label>
                        <input type="date" name="effective_to" id="effective_to" class="form-input">
                    </div>
                </div>

                <div>
                    <label for="notes" class="block text-sm font-medium text-zinc-700">Notes (Optional)</label>
                    <textarea name="notes" id="notes" rows="3" class="form-input"
                        placeholder="Additional notes..."></textarea>
                </div>

                <div class="flex justify-end space-x-3">
                    <a href="{% url 'shift:assignment_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-emerald">Create Assignment</button>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
