{% extends 'base.html' %}
{% load static %}

{% block extra_css %}
<style>
.btn {
    @apply inline-flex items-center px-4 py-2 border border-transparent text-sm font-medium rounded-md shadow-sm focus:outline-none focus:ring-2 focus:ring-offset-2 transition-colors duration-200;
}

.btn:disabled {
    @apply opacity-50 cursor-not-allowed;
}


#filterSection, #bulkActionDropdown, .ticket-card, #tableViewContainer, #cardViewContainer {
    @apply transition-all duration-300;
}

#summaryModal {
    backdrop-filter: blur(8px);
}

#bulkActionDropdown {
    @apply transform transition-all duration-200 origin-top-right;
}

#filterSection {
    @apply max-h-96 overflow-hidden;
}

#filterSection.hidden {
    @apply max-h-0 opacity-0;
    transform: translateY(-10px);
}

.view-container {
    @apply opacity-100 transform translate-y-0;
}

.view-container.hidden {
    @apply opacity-0 transform translate-y-4;
    pointer-events: none;
}

.loading-overlay {
    @apply fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center z-50;
    backdrop-filter: blur(4px);
}

.loading-overlay.hidden {
    @apply opacity-0 pointer-events-none;
}

.prose {
    @apply max-w-none;
}

.prose h3 {
    @apply text-lg font-semibold text-gray-900 mb-2;
}

.prose p {
    @apply text-gray-700 mb-4;
}

.prose ul {
    @apply list-disc list-inside space-y-1 text-gray-700;
}

.prose li {
    @apply text-sm;
}
</style>
{% endblock %}

{% block content %}
<div class="min-h-screen py-8">
    <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
        <div class="mb-8">
            <div class="flex justify-between items-center">
                <h1 class="text-4xl font-bold text-gray-800">Support Tickets</h1>
                <div class="flex items-center space-x-3">
                    <a href="{% url 'support:create_ticket' %}" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white font-semibold text-sm rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">
                        <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6"/>
                        </svg>
                        New Ticket
                    </a>
                    <a href="{% url 'support:ticket_export' %}" class="inline-flex items-center px-4 py-2 bg-white text-gray-700 font-semibold text-sm rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"/>
                        </svg>
                        Export
                    </a>
                    <a href="{% url 'support:dashboard' %}" class="inline-flex items-center px-4 py-2 bg-white text-gray-700 font-semibold text-sm rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <svg class="w-6 h-6 text-gray-800" fill="none" stroke="currentColor" viewBox="0 0 24 24" xmlns="http://www.w3.org/2000/svg">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path>
                          </svg>
                        Dashboard
                    </a>
                </div>
            </div>
        </div>

        <div class="bg-white rounded-xl shadow-md border border-gray-200 mb-6">
            <div class="p-6">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex-1 min-w-[200px]">
                        <div class="relative">
                             <input type="text" id="searchInput" placeholder="Search tickets..."
                                   class="block w-full pl-10 pr-4 py-2 border border-gray-300 rounded-lg bg-gray-50 focus:ring-2 focus:ring-blue-500 focus:border-blue-500 sm:text-sm transition-shadow">
                            <div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
                                <svg class="h-5 w-5 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"/>
                                </svg>
                            </div>
                        </div>
                    </div>

                    <div class="flex items-center bg-gray-100 rounded-lg p-1">
                        <button id="cardViewBtn" class="flex items-center px-3 py-1 text-sm font-semibold text-gray-800 bg-white rounded-md shadow-sm">
                            <svg class="w-4 h-4 mr-2 text-blue-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"/>
                            </svg>
                            Cards
                        </button>
                        <button id="tableViewBtn" class="flex items-center px-3 py-1 text-sm font-medium text-gray-500 hover:text-gray-800 ml-1">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 10h16M4 14h16M4 18h16"/>
                            </svg>
                            Table
                        </button>
                    </div>

                    <button id="filterToggle" class="inline-flex items-center px-4 py-2 bg-white text-gray-700 font-semibold text-sm rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">
                        <svg class="w-5 h-5 mr-2 text-gray-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 4a1 1 0 011-1h16a1 1 0 011 1v2.586a1 1 0 01-.293.707l-6.414 6.414a1 1 0 00-.293.707V17l-4 4v-6.586a1 1 0 00-.293-.707L3.293 7.207A1 1 0 013 6.5V4z"/>
                        </svg>
                        Filters
                    </button>

                    <div class="relative">
                        <button id="bulkActionToggle" class="inline-flex items-center px-4 py-2 bg-white text-gray-500 font-semibold text-sm rounded-lg border border-gray-300 shadow-sm transition-colors disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                            <svg class="w-5 h-5 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"/>
                            </svg>
                            Bulk Actions
                        </button>
                        <div id="bulkActionDropdown" class="hidden absolute right-0 mt-2 w-48 bg-white rounded-md shadow-lg ring-1 ring-black ring-opacity-5 z-10">
                            <div class="py-1">
                                <button onclick="bulkAction('assign')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900">Assign</button>
                                <button onclick="bulkAction('status')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900">Change Status</button>
                                <button onclick="bulkAction('priority')" class="block w-full text-left px-4 py-2 text-sm text-gray-700 hover:bg-gray-100 hover:text-gray-900">Change Priority</button>
                                <button onclick="bulkAction('delete')" class="block w-full text-left px-4 py-2 text-sm text-red-600 hover:bg-red-50 hover:text-red-700">Delete</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="filterSection" class="hidden mt-6 pt-6 border-t border-gray-200">
                    <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-6">
                        <div>
                            <label for="statusFilter" class="block text-sm font-medium text-gray-700 mb-1">Status</label>
                            <select id="statusFilter" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">All Status</option>
                                <option value="New">New</option>
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Pending User Response">Pending User Response</option>
                                <option value="Pending Third Party">Pending Third Party</option>
                                <option value="On Hold">On Hold</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                        <div>
                            <label for="priorityFilter" class="block text-sm font-medium text-gray-700 mb-1">Priority</label>
                            <select id="priorityFilter" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">All Priorities</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div>
                            <label for="issueTypeFilter" class="block text-sm font-medium text-gray-700 mb-1">Issue Type</label>
                            <select id="issueTypeFilter" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">All Types</option>
                                <option value="Hardware Issue">Hardware Issue</option>
                                <option value="Software Issue">Software Issue</option>
                                <option value="Network Issue">Network Issue</option>
                                <option value="Internet Issue">Internet Issue</option>
                                <option value="Application Issue">Application Issue</option>
                                <option value="HR Related Issue">HR Related Issue</option>
                                <option value="Access Management">Access Management</option>
                                <option value="Security Incident">Security Incident</option>
                                <option value="Service Request">Service Request</option>
                            </select>
                        </div>
                        <div>
                            <label for="assignedGroupFilter" class="block text-sm font-medium text-gray-700 mb-1">Assigned Group</label>
                            <select id="assignedGroupFilter" class="block w-full rounded-md border-gray-300 shadow-sm focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">All Groups</option>
                                <option value="HR">HR</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                    </div>
                    <div class="mt-6 flex space-x-4">
                        <button onclick="applyFilters()" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white font-semibold text-sm rounded-lg shadow-md hover:bg-blue-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-blue-500 transition-colors">Apply Filters</button>
                        <button onclick="clearFilters()" class="inline-flex items-center px-4 py-2 bg-white text-gray-700 font-semibold text-sm rounded-lg border border-gray-300 shadow-sm hover:bg-gray-50 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-colors">Clear Filters</button>
                    </div>
                </div>
            </div>
        </div>
  

        <!-- Loading Overlay -->
        <div id="loadingOverlay" class="loading-overlay hidden">
            <div class="bg-white rounded-lg p-6 max-w-sm mx-auto">
                <div class="flex items-center space-x-4">
                    <div class="animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600"></div>
                    <div class="text-lg font-medium text-gray-900">Loading tickets...</div>
                </div>
            </div>
        </div>

        <!-- Ticket Container -->
        <div id="ticketContainer">
            <!-- Card View -->
            <div id="cardViewContainer" class="view-container">
                <div id="cardGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6">
                    <!-- Cards will be inserted here -->
                </div>
            </div>

            <!-- Table View -->
            <div id="tableViewContainer" class="view-container hidden">
                <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-sm border border-gray-100 overflow-hidden">
                    <div class="overflow-x-auto">
                        <table class="min-w-full divide-y divide-gray-200">
                            <thead class="bg-gray-50">
                                <tr>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">
                                        <input type="checkbox" id="selectAll" class="rounded border-gray-300 text-blue-600 focus:ring-blue-500">
                                    </th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Ticket</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Priority</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Created</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Assigned To</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Attachments</th>
                                    <th class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Actions</th>
                                </tr>
                            </thead>
                            <tbody id="tableBody" class="bg-white divide-y divide-gray-200">
                                <!-- Table rows will be inserted here -->
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- Pagination -->
        <div id="paginationContainer" class="mt-6">
            <!-- Pagination will be inserted here -->
        </div>
    </div>
</div>

<!-- Bulk Action Modal -->
<div id="bulkActionModal" class="fixed inset-0 bg-gray-600 bg-opacity-50 hidden items-center justify-center z-50">
    <div class="bg-white rounded-lg max-w-md w-full m-4">
        <div class="px-6 py-4 border-b border-gray-200">
            <h3 class="text-lg font-medium text-gray-900" id="bulkActionTitle">Bulk Action</h3>
        </div>
        <div class="px-6 py-4">
            <form id="bulkActionForm" action="{% url 'support:bulk_ticket_actions' %}" method="POST">
                {% csrf_token %}
                <div id="bulkActionContent">
                    <!-- Dynamic content will be inserted here -->
                </div>
                <div class="mt-4 flex justify-end space-x-3">
                    <button type="button" onclick="closeBulkActionModal()" class="btn ">Cancel</button>
                    <button type="submit" class="btn ">Apply</button>
                </div>
            </form>
        </div>
    </div>
</div>

<script>
    // URL Template - Create a proper template at the top
    const TICKET_DETAIL_URL_TEMPLATE = "{% url 'support:ticket_detail' pk=999999 %}".replace('999999', '__TICKET_ID__');
    
    // Global variables
    let currentPage = 1;
    let currentView = 'cards';
    let tickets = [];
    let selectedTickets = [];
    let filters = {
        search: '',
        status: '',
        priority: '',
        issueType: '',
        assignedGroup: ''
    };
    
    // Helper function to generate ticket detail URLs
    function getTicketDetailUrl(ticketId) {
        return TICKET_DETAIL_URL_TEMPLATE.replace('__TICKET_ID__', ticketId);
    }
    
    // Initialize
    document.addEventListener('DOMContentLoaded', function() {
        initializeEventListeners();
        loadTickets();
    });
    
    function initializeEventListeners() {
        // Search input
        let searchTimeout;
        document.getElementById('searchInput').addEventListener('input', function(e) {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(() => {
                filters.search = e.target.value;
                currentPage = 1;
                loadTickets();
            }, 500);
        });
    
        // View toggle
        document.getElementById('cardViewBtn').addEventListener('click', () => switchView('cards'));
        document.getElementById('tableViewBtn').addEventListener('click', () => switchView('table'));
    
        // Filter toggle
        document.getElementById('filterToggle').addEventListener('click', function() {
            const filterSection = document.getElementById('filterSection');
            filterSection.classList.toggle('hidden');
        });
    
        // Bulk action toggle
        document.getElementById('bulkActionToggle').addEventListener('click', function() {
            const dropdown = document.getElementById('bulkActionDropdown');
            dropdown.classList.toggle('hidden');
        });
    
        // Select all checkbox
        document.getElementById('selectAll').addEventListener('change', function(e) {
            const checkboxes = document.querySelectorAll('.ticket-checkbox');
            checkboxes.forEach(checkbox => {
                checkbox.checked = e.target.checked;
            });
            updateSelectedTickets();
        });
    
        // Filter inputs
        ['statusFilter', 'priorityFilter', 'issueTypeFilter', 'assignedGroupFilter'].forEach(id => {
            document.getElementById(id).addEventListener('change', function() {
                const filterKey = id.replace('Filter', '');
                if (filterKey === 'issueType') {
                    filters.issueType = this.value;
                } else {
                    filters[filterKey] = this.value;
                }
                currentPage = 1;
                loadTickets();
            });
        });
    }
    
    function getCsrfToken() {
        return document.querySelector('[name=csrfmiddlewaretoken]').value;
    }
    
    async function loadTickets() {
        showLoading();
        
        try {
            const params = new URLSearchParams({
                page: currentPage,
                search: filters.search,
                status: filters.status,
                priority: filters.priority,
                issue_type: filters.issueType,
                assigned_group: filters.assignedGroup
            });
    
            const response = await fetch(`{% url 'support:ticket_list_api' %}?${params}`);
            const data = await response.json();
            
            if (data.error) {
                throw new Error(data.error);
            }
            
            tickets = data.tickets;
            renderTickets();
            renderPagination(data.pagination);
            
        } catch (error) {
            console.error('Error loading tickets:', error);
            showError('Failed to load tickets. Please try again.');
        } finally {
            hideLoading();
        }
    }
    
    function renderTickets() {
        if (currentView === 'cards') {
            renderCardView();
        } else {
            renderTableView();
        }
    }
    
    function renderCardView() {
        const cardGrid = document.getElementById('cardGrid');
        cardGrid.innerHTML = '';
        
        tickets.forEach(ticket => {
            const statusColor = getStatusColor(ticket.status);
            const priorityColor = getPriorityColor(ticket.priority);
            const ticketDetailUrl = getTicketDetailUrl(ticket.id);
            
            const card = document.createElement('div');
            card.className = 'ticket-card bg-white/70 backdrop-blur-sm rounded-xl shadow-sm border border-gray-100 overflow-hidden hover:shadow-md transition-shadow';
            card.innerHTML = `
                <div class="p-6">
                    <div class="flex items-start justify-between">
                        <div class="flex items-center space-x-3">
                            <input type="checkbox" class="ticket-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" 
                                   value="${ticket.id}" onchange="updateSelectedTickets()">
                            <div>
                                <h3 class="text-lg font-medium text-gray-900">
                                    <a href="${ticketDetailUrl}" class="hover:text-blue-600">
                                        ${ticket.subject}
                                    </a>
                                </h3>
                                <p class="text-sm text-gray-500">Ticket #${ticket.ticket_id}</p>
                            </div>
                        </div>
                        <div class="flex flex-col items-end space-y-2">
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                                ${ticket.status}
                            </span>
                            <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${priorityColor}">
                                ${ticket.priority}
                            </span>
                        </div>
                    </div>
                    
                    <div class="mt-4 space-y-2">
                        <div class="flex items-center text-sm text-gray-500">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                            </svg>
                            Created by ${ticket.user}
                        </div>
                        <div class="flex items-center text-sm text-gray-500">
                            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"/>
                            </svg>
                            ${formatDate(ticket.created_at)}
                        </div>
                        ${ticket.assigned_to ? `
                            <div class="flex items-center text-sm text-gray-500">
                                <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0 9 9 0 0118 0z"/>
                                </svg>
                                Assigned to ${ticket.assigned_to}
                            </div>
                        ` : ''}
                    </div>
                </div>
            `;
            cardGrid.appendChild(card);
        });
    }
    
    function renderTableView() {
        const tableBody = document.getElementById('tableBody');
        tableBody.innerHTML = '';
        
        tickets.forEach(ticket => {
            const statusColor = getStatusColor(ticket.status);
            const priorityColor = getPriorityColor(ticket.priority);
            const ticketDetailUrl = getTicketDetailUrl(ticket.id);
            
            const row = document.createElement('tr');
            row.className = 'hover:bg-gray-50';
            row.innerHTML = `
                <td class="px-6 py-4 whitespace-nowrap">
                    <input type="checkbox" class="ticket-checkbox rounded border-gray-300 text-blue-600 focus:ring-blue-500" 
                           value="${ticket.id}" onchange="updateSelectedTickets()">
                </td>
                <td class="px-6 py-4">
                    <div>
                        <div class="text-sm font-medium text-gray-900">
                            <a href="${ticketDetailUrl}" class="hover:text-blue-600">
                                ${ticket.subject}
                            </a>
                        </div>
                        <div class="text-sm text-gray-500">Ticket #${ticket.ticket_id}</div>
                        <div class="text-sm text-gray-500">by ${ticket.user}</div>
                    </div>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${statusColor}">
                        ${ticket.status}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap">
                    <span class="inline-flex items-center px-2.5 py-0.5 rounded-full text-xs font-medium ${priorityColor}">
                        ${ticket.priority}
                    </span>
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${formatDate(ticket.created_at)}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${ticket.assigned_to || 'Unassigned'}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-sm text-gray-500">
                    ${ticket.attachments_count || 0}
                </td>
                <td class="px-6 py-4 whitespace-nowrap text-right text-sm font-medium">
                    <a href="${ticketDetailUrl}" class="text-blue-600 hover:text-blue-900">
                        View
                    </a>
                </td>
            `;
            tableBody.appendChild(row);
        });
    }
    
    function renderPagination(pagination) {
        const container = document.getElementById('paginationContainer');
        if (pagination.pages <= 1) {
            container.innerHTML = '';
            return;
        }
        
        let paginationHTML = `
            <div class="bg-white/70 backdrop-blur-sm rounded-xl shadow-sm border border-gray-100 px-6 py-4">
                <div class="flex items-center justify-between">
                    <div class="text-sm text-gray-700">
                        Showing ${((pagination.page - 1) * pagination.per_page) + 1} to ${Math.min(pagination.page * pagination.per_page, pagination.total)} of ${pagination.total} tickets
                    </div>
                    <div class="flex items-center space-x-2">
        `;
        
        // Previous button
        if (pagination.page > 1) {
            paginationHTML += `<button onclick="changePage(${pagination.page - 1})" class="btn btn-secondary px-3 py-1 text-sm">Previous</button>`;
        }
        
        // Page numbers
        for (let i = Math.max(1, pagination.page - 2); i <= Math.min(pagination.pages, pagination.page + 2); i++) {
            const isActive = i === pagination.page;
            paginationHTML += `
                <button onclick="changePage(${i})" 
                        class="btn ${isActive ? 'btn-primary' : 'btn-secondary'} px-3 py-1 text-sm">
                    ${i}
                </button>
            `;
        }
        
        // Next button
        if (pagination.page < pagination.pages) {
            paginationHTML += `<button onclick="changePage(${pagination.page + 1})" class="btn btn-secondary px-3 py-1 text-sm">Next</button>`;
        }
        
        paginationHTML += `
                    </div>
                </div>
            </div>
        `;
        
        container.innerHTML = paginationHTML;
    }
    
    function changePage(page) {
        currentPage = page;
        loadTickets();
    }
    
    function switchView(view) {
        currentView = view;
        
        const cardViewBtn = document.getElementById('cardViewBtn');
        const tableViewBtn = document.getElementById('tableViewBtn');
        const cardContainer = document.getElementById('cardViewContainer');
        const tableContainer = document.getElementById('tableViewContainer');
        
        if (view === 'cards') {
            cardViewBtn.classList.add('active');
            tableViewBtn.classList.remove('active');
            cardContainer.classList.remove('hidden');
            tableContainer.classList.add('hidden');
        } else {
            tableViewBtn.classList.add('active');
            cardViewBtn.classList.remove('active');
            tableContainer.classList.remove('hidden');
            cardContainer.classList.add('hidden');
        }
        
        renderTickets();
    }
    
    function updateSelectedTickets() {
        const checkboxes = document.querySelectorAll('.ticket-checkbox:checked');
        selectedTickets = Array.from(checkboxes).map(cb => cb.value);
        
        const bulkActionBtn = document.getElementById('bulkActionToggle');
        const selectAllCheckbox = document.getElementById('selectAll');
        
        bulkActionBtn.disabled = selectedTickets.length === 0;
        
        // Update select all checkbox state
        const allCheckboxes = document.querySelectorAll('.ticket-checkbox');
        if (selectedTickets.length === 0) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = false;
        } else if (selectedTickets.length === allCheckboxes.length) {
            selectAllCheckbox.indeterminate = false;
            selectAllCheckbox.checked = true;
        } else {
            selectAllCheckbox.indeterminate = true;
        }
    }
    
    function showLoading() {
        document.getElementById('loadingOverlay').classList.remove('hidden');
    }
    
    function hideLoading() {
        document.getElementById('loadingOverlay').classList.add('hidden');
    }
    
    function showError(message) {
        alert(message); // Simple alert for now, can be replaced with better UI
    }
    
    function getStatusColor(status) {
        const colors = {
            'New': 'bg-blue-100 text-blue-800',
            'Open': 'bg-green-100 text-green-800',
            'In Progress': 'bg-yellow-100 text-yellow-800',
            'Pending User Response': 'bg-purple-100 text-purple-800',
            'Pending Third Party': 'bg-pink-100 text-pink-800',
            'On Hold': 'bg-gray-100 text-gray-800',
            'Resolved': 'bg-green-100 text-green-800',
            'Closed': 'bg-gray-100 text-gray-800'
        };
        return colors[status] || 'bg-gray-100 text-gray-800';
    }
    
    function getPriorityColor(priority) {
        const colors = {
            'Low': 'bg-green-100 text-green-800',
            'Medium': 'bg-yellow-100 text-yellow-800',
            'High': 'bg-orange-100 text-orange-800',
            'Critical': 'bg-red-100 text-red-800'
        };
        return colors[priority] || 'bg-gray-100 text-gray-800';
    }
    
    function formatDate(dateString) {
        const date = new Date(dateString);
        return date.toLocaleDateString('en-US', {
            year: 'numeric',
            month: 'short',
            day: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
        });
    }
    
    // Continue with bulk actions and other functions...
    function bulkAction(action) {
        document.getElementById('bulkActionDropdown').classList.add('hidden');
        
        if (selectedTickets.length === 0) {
            alert('Please select tickets first.');
            return;
        }
        
        let title, content;
        
        switch (action) {
            case 'assign':
                title = 'Assign Tickets';
                content = `
                    <input type="hidden" name="action" value="assign">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Assign to User</label>
                            <select name="assigned_to_user" class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">Select a user...</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Assign to Group</label>
                            <select name="assigned_group" class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">No Group</option>
                                <option value="HR">HR</option>
                                <option value="Admin">Admin</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
                            <textarea name="comment" rows="3" class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Optional comment"></textarea>
                        </div>
                    </div>
                `;
                break;
                
            case 'status':
                title = 'Change Status';
                content = `
                    <input type="hidden" name="action" value="change_status">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">New Status</label>
                            <select name="new_status" required class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">Select status...</option>
                                <option value="New">New</option>
                                <option value="Open">Open</option>
                                <option value="In Progress">In Progress</option>
                                <option value="Pending User Response">Pending User Response</option>
                                <option value="Pending Third Party">Pending Third Party</option>
                                <option value="On Hold">On Hold</option>
                                <option value="Resolved">Resolved</option>
                                <option value="Closed">Closed</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
                            <textarea name="comment" rows="3" class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Optional comment about status change"></textarea>
                        </div>
                    </div>
                `;
                break;
                
            case 'priority':
                title = 'Change Priority';
                content = `
                    <input type="hidden" name="action" value="change_priority">
                    <div class="space-y-4">
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">New Priority</label>
                            <select name="new_priority" required class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm">
                                <option value="">Select priority...</option>
                                <option value="Low">Low</option>
                                <option value="Medium">Medium</option>
                                <option value="High">High</option>
                                <option value="Critical">Critical</option>
                            </select>
                        </div>
                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Comment</label>
                            <textarea name="comment" rows="3" class="block w-full rounded-md border border-gray-300 px-3 py-2 focus:border-blue-500 focus:ring-blue-500 sm:text-sm" placeholder="Optional comment about priority change"></textarea>
                        </div>
                    </div>
                `;
                break;
                
            case 'delete':
                title = 'Delete Tickets';
                content = `
                    <input type="hidden" name="action" value="delete">
                    <div class="space-y-4">
                        <div class="bg-red-50 border border-red-200 rounded-md p-4">
                            <div class="flex">
                                <div class="flex-shrink-0">
                                    <svg class="h-5 w-5 text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 9v2m0 4h.01m-6.938 4h13.856c1.54 0 2.502-1.667 1.732-2.5L13.732 4c-.77-.833-1.964-.833-2.732 0L4.082 16.5c-.77.833.192 2.5 1.732 2.5z"/>
                                    </svg>

                        <div>
                            <label class="block text-sm font-medium text-gray-700 mb-1">Reason for deletion</label>

                `;
                break;
        }
        
        document.getElementById('bulkActionTitle').textContent = title;
        document.getElementById('bulkActionContent').innerHTML = content;
        
        // Add selected ticket IDs to form
        selectedTickets.forEach(ticketId => {
            const input = document.createElement('input');
            input.type = 'hidden';
            input.name = 'ticket_ids';
            input.value = ticketId;
            document.getElementById('bulkActionContent').appendChild(input);
        });
        
        document.getElementById('bulkActionModal').classList.remove('hidden');
        document.getElementById('bulkActionModal').classList.add('flex');
    }
    
    function closeBulkActionModal() {
        document.getElementById('bulkActionModal').classList.add('hidden');
        document.getElementById('bulkActionModal').classList.remove('flex');
    }
    
    function applyFilters() {
        const statusFilter = document.getElementById('statusFilter').value;
        const priorityFilter = document.getElementById('priorityFilter').value;
        const issueTypeFilter = document.getElementById('issueTypeFilter').value;
        const assignedGroupFilter = document.getElementById('assignedGroupFilter').value;
        
        filters.status = statusFilter;
        filters.priority = priorityFilter;
        filters.issueType = issueTypeFilter;
        filters.assignedGroup = assignedGroupFilter;
        
        currentPage = 1;
        loadTickets();
    }
    
    function clearFilters() {
        document.getElementById('statusFilter').value = '';
        document.getElementById('priorityFilter').value = '';
        document.getElementById('issueTypeFilter').value = '';
        document.getElementById('assignedGroupFilter').value = '';
        document.getElementById('searchInput').value = '';
        
        filters = {
            search: '',
            status: '',
            priority: '',
            issueType: '',
            assignedGroup: ''
        };
        
        currentPage = 1;
        loadTickets();
    }
    </script>
