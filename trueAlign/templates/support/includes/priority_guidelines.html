<!-- Priority Guidelines -->

    <!-- Soft Orb -->
    <div class="absolute -top-8 -right-8 w-24 h-24 bg-gradient-to-br from-blue-300/30 to-blue-400/10 rounded-full"></div>
    
    <div class="relative p-6 z-10">
        <div class="flex items-center mb-4">
            <div class="w-8 h-8 backdrop-blur-sm bg-blue-100/50 rounded-lg flex items-center justify-center mr-3">
                <svg class="h-5 w-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">

            <div class="border-l-4 border-red-400 pl-4">
                <h4 class="font-semibold text-red-700">Critical</h4>

                <p class="text-sm text-blue-600">Important but not urgent, workaround available</p>
            </div>
            <div class="border-l-4 border-gray-400 pl-4">
