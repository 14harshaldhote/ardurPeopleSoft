{% load humanize %}

<div
    class="backdrop-blur-xl bg-white/20 p-5 rounded-[16px] border border-black/10 shadow-inner hover:bg-white/25 transition-all duration-300">
    <div class="flex justify-between items-start mb-4">
        <div class="flex items-center gap-3">
            <div class="p-3 backdrop-blur-sm bg-rose-500/20 rounded-xl border border-rose-500/30">
                <svg class="w-6 h-6 text-rose-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z" />
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-zinc-700">Unpaid Invoices</h3>
                <p class="text-2xl font-bold text-zinc-900">{{ pending_invoice_count }}</p>
            </div>
        </div>
        {% if overdue_invoice_count > 0 %}
        <span
            class="px-3 py-1 rounded-full text-xs font-medium bg-red-500/20 text-red-700 border border-red-500/30 animate-pulse">
            {{ overdue_invoice_count }} Overdue
        </span>
        {% endif %}
    </div>
    <div class="flex justify-between items-center pt-3 border-t border-white/20">
        <span class="text-sm text-zinc-600">This Month Revenue</span>
        <span class="text-sm font-bold text-zinc-800">₹ {{ this_month_revenue|floatformat:2|intcomma }}</span>
    </div>
    <a href="{% url 'finance:invoice_list' %}"
        class="mt-3 inline-flex items-center text-sm text-blue-700 hover:text-blue-900 font-medium transition-colors duration-200">
        View All <i class="ri-arrow-right-line ml-1"></i>
    </a>
</div>
