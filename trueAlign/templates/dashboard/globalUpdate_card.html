<div class="backdrop-blur-xl bg-white/20 p-3 sm:p-4 lg:p-6 rounded-[12px] sm:rounded-[16px] lg:rounded-[20px] border border-white/10 shadow-inner hover:bg-white/25 transition-all duration-300"
    id="global-update-card" data-user-role="{{ user.groups.all|join:',' }}"
    data-is-hr="{% if is_hr %}True{% else %}False{% endif %}"
    data-is-employee="{% if is_employee %}True{% else %}False{% endif %}"
    data-is-manager="{% if is_manager %}True{% else %}False{% endif %}">
    <!-- Header Section -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-6 gap-4 sm:gap-0">
        <div class="flex items-center gap-4">
            <div class="p-3 bg-gradient-to-r from-teal-500 to-teal-600 rounded-xl shadow-lg">
                <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6 text-white" fill="none" viewBox="0 0 24 24"
                    stroke="currentColor" stroke-width="2">
                    <path stroke-linecap="round" stroke-linejoin="round"
                        d="M11 5.882V19.24a1.76 1.76 0 01-3.417.592l-2.147-6.15M18 13a3 3 0 100-6M5.436 13.683A4.001 4.001 0 017 6h1.832c4.1 0 7.625-1.234 9.168-3v14c-1.543-1.766-5.067-3-9.168-3H7a3.988 3.988 0 01-1.564-.317z" />
                </svg>
            </div>
            <div>
                <h3 class="text-xl font-bold text-gray-900 font-system tracking-tight">
                    Global Updates
                </h3>
                <p class="text-sm text-gray-600 font-medium">
                    Latest company announcements
                </p>
            </div>
        </div>

        <!-- Language Selector -->
        <div class="flex items-center">
            <select id="language-selector"
                class="px-4 py-2 bg-white/80 backdrop-blur-sm border border-gray-200 rounded-xl text-sm font-medium text-gray-700 focus:outline-none focus:ring-2 focus:ring-blue-500 focus:border-transparent transition-all duration-200 hover:bg-white">
                <option value="en">🇺🇸 English</option>
                <option value="hi">🇮🇳 हिंदी</option>
                <option value="mr">🇮🇳 मराठी</option>
            </select>
        </div>
    </div>

    <!-- HR Management Buttons -->
    {% if is_hr %}
    <div
        class="flex flex-wrap gap-3 mb-6 p-4 bg-gradient-to-r from-gray-50 to-gray-100 rounded-xl border border-gray-200">
        <a href="{% url 'notes:global_update_create' %}"
            class="inline-flex items-center px-4 py-2.5 bg-gradient-to-r from-emerald-500 to-emerald-600 text-white rounded-lg hover:from-emerald-600 hover:to-emerald-700 transition-all duration-200 text-sm font-semibold shadow-md hover:shadow-lg hover:scale-105 transform">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
            </svg>
            Add Update
        </a>
        <a href="{% url 'notes:global_update_list' %}"
            class="inline-flex items-center px-4 py-2.5 bg-gradient-to-r from-blue-500 to-blue-600 text-white rounded-lg hover:from-blue-600 hover:to-blue-700 transition-all duration-200 text-sm font-semibold shadow-md hover:shadow-lg hover:scale-105 transform">
            <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 5H7a2 2 0 00-2 2v10a2 2 0 002 2h8a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2">
                </path>
            </svg>
            Manage All
        </a>
    </div>
    {% endif %}

    <!-- Updates Container -->
    <div class="relative">
        <!-- Loading Indicator -->
        <div id="loading-indicator" class="text-center py-12">
            <div class="inline-block animate-spin rounded-full h-8 w-8 border-b-2 border-blue-600 mb-4"></div>
            <p class="text-gray-600 font-medium">Loading updates...</p>
        </div>

        <!-- Updates List -->
        <div id="updates-list" class="space-y-4 max-h-96 overflow-y-auto pr-2 scroll-smooth" style="display: none">
            <!-- Updates will be loaded here -->
        </div>
    </div>

    <!-- View All Button -->
    <div class="mt-6 pt-4 border-t border-gray-200">
        <a href="{% url 'notes:global_update_list' %}"
            class="inline-flex items-center text-blue-600 hover:text-blue-800 transition-colors duration-200 font-semibold text-sm group">
            <span>View All Updates</span>
            <svg class="w-4 h-4 ml-2 transition-transform duration-200 group-hover:translate-x-1" fill="none"
                stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
            </svg>
        </a>
    </div>
</div>

<!-- Enhanced Styles -->
<style>
    @import url("https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap");

    .font-system {
        font-family:
            "Inter",
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            "Helvetica Neue",
            Arial,
            sans-serif;
    }

    #global-update-card {
        font-family:
            "Inter",
            system-ui,
            -apple-system,
            BlinkMacSystemFont,
            "Segoe UI",
            Roboto,
            "Helvetica Neue",
            Arial,
            sans-serif;
    }

    .update-item {
        @apply bg-white/90 backdrop-blur-sm p-4 rounded-xl border-l-4 hover:bg-white transition-all duration-300 cursor-pointer shadow-sm hover:shadow-lg transform hover:scale-[1.02] hover:-translate-y-1;
        /* subtle colorful left accent for better identification */
        border-left-width: 6px;
        border-left-color: rgba(124, 58, 237, 0.92);
        /* default accent color (will be overridden by status classes) */
    }

    .update-item.released {
        @apply border-emerald-500 bg-gradient-to-r from-emerald-50/80 to-emerald-100/60;
        border-left-color: rgba(16, 185, 129, 0.95);
    }

    .update-item.upcoming {
        @apply border-blue-500 bg-gradient-to-r from-blue-50/80 to-blue-100/60;
        border-left-color: rgba(59, 130, 246, 0.95);
    }

    .update-item.scheduled {
        @apply border-amber-500 bg-gradient-to-r from-amber-50/80 to-amber-100/60;
        border-left-color: rgba(245, 158, 11, 0.95);
    }

    /* Title: bold + colorful gradient text for strong identification */
    .update-title {
        @apply mb-2 leading-tight;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 1.05rem;
        /* gradient text */
        background: linear-gradient(90deg, #1f2937, #7c3aed);
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
        /* slight lift so titles feel prominent */
        text-shadow: 0 1px 0 rgba(0, 0, 0, 0.03);
    }

    /* Description: thinner / lighter font for visual hierarchy */
    .update-description {
        @apply text-sm mb-3 leading-relaxed line-clamp-2;
        font-family: "Inter", sans-serif;
        font-weight: 300;
        /* thin */
        color: #475569;
        /* slate-600 */
    }

    /* Language indicator: italic and slightly bolder to stand out */
    .language-indicator {
        @apply px-2 py-1 bg-blue-100/70 text-blue-700 rounded-md text-xs font-medium border border-blue-200/50 shadow-sm;
        font-style: italic;
        font-weight: 600;
        letter-spacing: 0.01em;
    }

    .status-badge {
        @apply px-2 py-1 rounded-full text-xs font-semibold uppercase tracking-wide;
    }

    .status-released {
        @apply bg-emerald-100 text-emerald-800;
    }

    .status-upcoming {
        @apply bg-blue-100 text-blue-800;
    }

    .status-scheduled {
        @apply bg-amber-100 text-amber-800;
    }

    /* Custom Scrollbar */
    #updates-list::-webkit-scrollbar {
        width: 6px;
    }

    #updates-list::-webkit-scrollbar-track {
        background: #f1f5f9;
        border-radius: 10px;
    }

    #updates-list::-webkit-scrollbar-thumb {
        background: linear-gradient(to bottom, #cbd5e1, #94a3b8);
        border-radius: 10px;
    }

    #updates-list::-webkit-scrollbar-thumb:hover {
        background: linear-gradient(to bottom, #94a3b8, #64748b);
    }

    /* Line clamp utility */
    .line-clamp-2 {
        display: -webkit-box;
        -webkit-line-clamp: 2;
        -webkit-box-orient: vertical;
        overflow: hidden;
    }

    /* Smooth animations */
    .animate-fade-in {
        animation: fadeIn 0.3s ease-in-out;
    }

    @keyframes fadeIn {
        from {
            opacity: 0;
            transform: translateY(10px);
        }

        to {
            opacity: 1;
            transform: translateY(0);
        }
    }
</style>

<!-- Simplified JavaScript (unchanged) -->
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const languageSelector = document.getElementById("language-selector");
        const updatesContainer = document.getElementById("updates-list");
        const loadingIndicator = document.getElementById("loading-indicator");

        // Initialize language from localStorage
        const savedLanguage =
            localStorage.getItem("global-updates-language") || "en";
        languageSelector.value = savedLanguage;

        function showLoading() {
            loadingIndicator.style.display = "block";
            updatesContainer.style.display = "none";
        }

        function hideLoading() {
            loadingIndicator.style.display = "none";
            updatesContainer.style.display = "block";
        }

        function loadUpdates(language = "en") {
            showLoading();

            const card = document.getElementById("global-update-card");
            if (!card) return;

            const params = new URLSearchParams({
                lang: language,
                limit: 5,
                is_hr: card.dataset.isHr === "True",
                is_employee: card.dataset.isEmployee === "True",
                is_manager: card.dataset.isManager === "True",
            });

            const url =
                "{% url 'notes:global_update_ajax_status' %}?" +
                params.toString();

            fetch(url)
                .then((response) => {
                    if (response.status === 401) {
                        throw new Error("AUTHENTICATION_REQUIRED");
                    }
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}`);
                    }
                    return response.json();
                })
                .then((data) => {
                    if (data.redirect_to_login) {
                        showAuthError();
                        return;
                    }

                    if (!data.success) {
                        throw new Error(data.error || "Unknown error");
                    }

                    localStorage.setItem("global-updates-language", language);
                    renderUpdates(data.updates || [], language);
                    hideLoading();
                })
                .catch((error) => {
                    hideLoading();
                    if (error.message === "AUTHENTICATION_REQUIRED") {
                        showAuthError();
                    } else {
                        showError(error.message);
                    }
                });
        }

        function renderUpdates(updates, language) {
            if (!updates.length) {
                showEmptyState();
                return;
            }

            const html = updates
                .map((update) => {
                    const status = (update.status || "released").toLowerCase();
                    const title =
                        update.translated_title || update.title || "Untitled";
                    const description =
                        update.translated_description ||
                        update.description ||
                        "";
                    const hasTranslation =
                        language !== "en"
                            ? Boolean(update.has_translation)
                            : true;

                    return `
                <div class="update-item ${status} animate-fade-in rounded-xl p-2" onclick="viewUpdate(${update.id}, '${language}')">
                    <div class="update-title">${escapeHtml(title)}</div>
                    <div class="update-description ">${escapeHtml(description)}</div>
                    <div class="update-meta">
                        <div class="flex items-center gap-2">
                            <span class="language-indicator">${getLanguageName(language)}</span>
                            ${!hasTranslation && language !== "en"
                            ? '<span class="text-xs italic text-blue-600 font-medium">Auto-translated</span>'
                            : ""
                        }
                        </div>
                        <div class="flex items-center gap-2">
                            <span class="status-badge status-${status}">${status}</span>
                            ${update.scheduled_date ? `<span class="text-xs text-red-500">• ${formatDate(update.scheduled_date)}</span>` : ""}
                        </div>
                    </div>
                </div>
            `;
                })
                .join("");

            updatesContainer.innerHTML = html;
        }

        function showEmptyState() {
            const card = document.getElementById("global-update-card");
            const isHR = card?.dataset.isHr === "True";

            updatesContainer.innerHTML = `
            <div class="text-center py-12">
                <div class="w-16 h-16 mx-auto mb-4 bg-gradient-to-br from-gray-100 to-gray-200 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 13V6a2 2 0 00-2-2H6a2 2 0 00-2 2v7m16 0v5a2 2 0 01-2 2H6a2 2 0 01-2 2v-5m16 0h-2.586a1 1 0 00-.707.293l-2.414 2.414a1 1 0 01-.707.293h-3.172a1 1 0 01-.707-.293l-2.414-2.414A1 1 0 006.586 13H4"></path>
                    </svg>
                </div>
                <p class="text-gray-600 font-semibold mb-2">No updates available</p>
                <p class="text-gray-500 text-sm mb-4">Check back later for new announcements</p>
                ${isHR
                    ? `
                    <a href="{% url 'notes:global_update_create' %}" class="inline-flex items-center px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-semibold">
                        <svg class="w-4 h-4 mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        Create First Update
                    </a>
                `
                    : ""
                }
            </div>
        `;
        }

        function showAuthError() {
            updatesContainer.innerHTML = `
            <div class="text-center py-8">
                <div class="w-16 h-16 mx-auto mb-4 bg-yellow-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-yellow-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 15v2m-6 4h12a2 2 0 002-2v-6a2 2 0 00-2-2H6a2 2 0 00-2 2v6a2 2 0 002 2zm10-10V7a4 4 0 00-8 0v4h8z"></path>
                    </svg>
                </div>
                <p class="text-gray-800 font-semibold mb-2">Session Expired</p>
                <p class="text-gray-600 text-sm mb-4">Please log in to view updates</p>
                <button onclick="window.location.href='/login/'" class="px-4 py-2 bg-blue-600 text-white rounded-lg hover:bg-blue-700 transition-colors text-sm font-semibold">
                    Go to Login
                </button>
            </div>
        `;
        }

        function showError(message) {
            updatesContainer.innerHTML = `
            <div class="text-center py-8">
                <div class="w-16 h-16 mx-auto mb-4 bg-red-100 rounded-full flex items-center justify-center">
                    <svg class="w-8 h-8 text-red-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4m0 4h.01M21 12a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                </div>
                <p class="text-gray-800 font-semibold mb-2">Unable to Load Updates</p>
                <p class="text-gray-600 text-sm mb-4">Please try again</p>
                <button onclick="loadUpdates(languageSelector.value)" class="px-4 py-2 bg-red-600 text-white rounded-lg hover:bg-red-700 transition-colors text-sm font-semibold">
                    Retry
                </button>
            </div>
        `;
        }

        // Helper functions
        function escapeHtml(text) {
            const div = document.createElement("div");
            div.textContent = text || "";
            return div.innerHTML;
        }

        function getLanguageName(code) {
            const names = { en: "EN", hi: "हि", mr: "मर" };
            return names[code] || "EN";
        }

        function formatDate(dateString) {
            if (!dateString) return "";
            try {
                return new Date(dateString).toLocaleDateString();
            } catch {
                return "";
            }
        }

        function viewUpdate(id, language) {
            if (id && id > 0) {
                window.location.href =
                    `{% url 'notes:global_update_detail' 0 %}`.replace(
                        "0",
                        id,
                    ) + `?lang=${language}`;
            }
        }

        // Event listeners
        languageSelector.addEventListener("change", function () {
            loadUpdates(this.value);
        });

        // Initialize
        loadUpdates(savedLanguage);

        // Auto-refresh every 5 minutes
        setInterval(() => loadUpdates(languageSelector.value), 300000);
    });
</script>
