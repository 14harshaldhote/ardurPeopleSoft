{% load humanize %}

<div
    class="backdrop-blur-xl bg-white/20 p-5 rounded-[16px] border border-black/10 shadow-inner hover:bg-white/25 transition-all duration-300">
    <div class="flex justify-between items-start mb-4">
        <div class="flex items-center gap-3">
            <div class="p-3 backdrop-blur-sm bg-cyan-500/20 rounded-xl border border-cyan-500/30">
                <svg class="w-6 h-6 text-cyan-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15" />
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-zinc-700">Active Subscriptions</h3>
                <p class="text-2xl font-bold text-zinc-900">{{ upcoming_subscriptions.count }}</p>
            </div>
        </div>
    </div>
    {% if upcoming_subscriptions %}
    <div class="space-y-2">
        <div class="text-xs text-zinc-600 font-medium">Upcoming Renewals (30 days)</div>
        {% for sub in upcoming_subscriptions|slice:":3" %}
        <div class="flex justify-between items-center text-xs backdrop-blur-sm bg-white/30 p-2 rounded-lg">
            <span class="text-zinc-700">{{ sub.name|truncatechars:20 }}</span>
            <span class="font-medium text-cyan-700">{{ sub.next_payment_date|date:"M d" }}</span>
        </div>
        {% endfor %}
    </div>
    {% endif %}
    <a href="{% url 'finance:subscription_list' %}"
        class="mt-3 inline-flex items-center text-sm text-blue-700 hover:text-blue-900 font-medium transition-colors duration-200">
        View All <i class="ri-arrow-right-line ml-1"></i>
    </a>
</div>
