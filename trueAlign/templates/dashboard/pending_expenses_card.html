{% load humanize %}

<div
    class="backdrop-blur-xl bg-white/20 p-5 rounded-[16px] border border-black/10 shadow-inner hover:bg-white/25 transition-all duration-300">
    <div class="flex justify-between items-start mb-4">
        <div class="flex items-center gap-3">
            <div class="p-3 backdrop-blur-sm bg-amber-500/20 rounded-xl border border-amber-500/30">
                <svg class="w-6 h-6 text-amber-700" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 5H7a2 2 0 00-2 2v12a2 2 0 002 2h10a2 2 0 002-2V7a2 2 0 00-2-2h-2M9 5a2 2 0 002 2h2a2 2 0 002-2M9 5a2 2 0 012-2h2a2 2 0 012 2" />
                </svg>
            </div>
            <div>
                <h3 class="text-sm font-semibold text-zinc-700">Pending Expenses</h3>
                <p class="text-2xl font-bold text-zinc-900">{{ pending_expenses_count }}</p>
            </div>
        </div>
        {% if pending_expenses_count > 0 %}
        <span
            class="px-3 py-1 rounded-full text-xs font-medium bg-amber-500/20 text-amber-700 border border-amber-500/30 animate-pulse">
            Action Required
        </span>
        {% endif %}
    </div>
    <div class="flex justify-between items-center pt-3 border-t border-white/20">
        <span class="text-sm text-zinc-600">This Month</span>
        <span class="text-sm font-bold text-zinc-800">₹ {{ this_month_expenses|floatformat:2|intcomma }}</span>
    </div>
    <a href="{% url 'finance:expense_list' %}"
        class="mt-3 inline-flex items-center text-sm text-blue-700 hover:text-blue-900 font-medium transition-colors duration-200">
        View All <i class="ri-arrow-right-line ml-1"></i>
    </a>
</div>
