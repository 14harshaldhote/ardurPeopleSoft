<div

                    viewBox="0 0 24 24"
                    stroke="currentColor"

                        stroke-linecap="round"
                        stroke-linejoin="round"
                        stroke-width="2"

                stroke="currentColor"

                    viewBox="0 0 24 24"

        <div class="grid grid-cols-1 sm:grid-cols-3 gap-2 sm:gap-3">

                    2

            <div
