<div
    class="backdrop-blur-xl bg-white/20 p-4 sm:p-5 lg:p-6 rounded-[16px] lg:rounded-[20px] border border-black/10 shadow-inner hover:bg-white/25 transition-all duration-300"
>
    <!-- Header -->
    <div class="flex flex-col sm:flex-row justify-between items-start sm:items-center mb-5 gap-3">
        <div class="flex items-center gap-3">
            <div
                class="p-2 sm:p-3 backdrop-blur-sm bg-white/30 rounded-xl border border-white/20"
            >
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="h-5 w-5 sm:h-6 sm:w-6 text-emerald-700"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor"
                >
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z" />
                </svg>
            </div>
            <div>
                <h3 class="text-base sm:text-lg font-bold text-zinc-900 mb-0">Performance</h3>
                <p class="text-sm text-zinc-600 mb-0">Monthly overview</p>
            </div>
        </div>
        <span
            class="px-3 py-1 text-xs font-medium bg-emerald-500/20 text-emerald-700 rounded-md border border-emerald-500/30 animate-pulse"
        >
            On Track
        </span>
    </div>

    <!-- Gauge -->
    <div class="relative mb-5">
        

        <!-- Tracking Info Message -->
        <div class="mt-4 text-center text-sm sm:text-base text-zinc-700">
            <div
                class="inline-flex items-center gap-2 px-3 py-1.5 bg-white/30 backdrop-blur-md border border-white/20 rounded-lg shadow-sm hover:bg-white/40 transition-all"
            >
                <svg xmlns="http://www.w3.org/2000/svg"
                    class="w-4 h-4 sm:w-5 sm:h-5 text-blue-600"
                    fill="none"
                    viewBox="0 0 24 24"
                    stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M13 16h-1v-4h-1m1-4h.01M12 20a8 8 0 100-16 8 8 0 000 16z"/>
                </svg>
                <span class="font-medium">
                    Tracking in progress — live performance insights will be
                    <span class="text-blue-600 font-semibold">enabled soon</span>.
                </span>
            </div>
        </div>
    </div>

    <!-- Performance Stats (Dynamic placeholders) -->
    <div class="grid grid-cols-1 sm:grid-cols-2 gap-3 mb-5">
        <!-- Projects -->
        <div
            class="backdrop-blur-sm bg-emerald-500/20 border border-emerald-500/30 rounded-xl p-4 text-center hover:bg-emerald-500/30 transition-all duration-200"
        >
            <div class="flex items-center justify-center gap-2 mb-2">
                <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M19 11H5m14 0a2 2 0 012 2v6a2 2 0 01-2 2H5a2 2 0 01-2-2v-6a2 2 0 012-2m14 0V9a2 2 0 00-2-2M5 9a2 2 0 00-2 2v2" />
                </svg>
                <span class="text-xs font-medium text-emerald-700 uppercase tracking-wide">Projects</span>
            </div>
            <p class="text-2xl font-bold text-emerald-700 mb-0" id="activeProjects">—</p>
            <p class="text-xs text-emerald-600">Active</p>
        </div>

        <!-- Goals Met -->
        <div
            class="backdrop-blur-sm bg-blue-500/20 border border-blue-500/30 rounded-xl p-4 text-center hover:bg-blue-500/30 transition-all duration-200"
        >
            <div class="flex items-center justify-center gap-2 mb-2">
                <svg class="w-4 h-4 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                        d="M9 12l2 2 4-4m6 2a9 9 0 11-18 0z" />
                </svg>
                <span class="text-xs font-medium text-blue-700 uppercase tracking-wide">Goals Met</span>
            </div>
            <p class="text-2xl font-bold text-blue-700 mb-0" id="goalsMet">—</p>
            <p class="text-xs text-blue-600">of total</p>
        </div>
    </div>

    <!-- KPI Progress -->
    <div>
        <div class="backdrop-blur-sm bg-white/30 p-4 rounded-xl border border-white/20">
            <div class="flex justify-between items-center mb-2">
                <h4 class="text-sm font-bold text-zinc-700">Performance Index</h4>
                <span class="text-sm font-semibold text-zinc-800" id="performanceIndex">—</span>
            </div>
            <div class="w-full bg-white/40 rounded-full h-3 border border-white/20 overflow-hidden">
                <div
                    id="performanceBar"
                    class="h-full rounded-full bg-gradient-to-r from-orange-400 via-emerald-500 to-blue-400 transition-all duration-1000"
                    style="width: 0%"
                ></div>
            </div>
            <div class="flex justify-between items-center mt-2 text-xs text-zinc-600">
                <span>Target: —</span>
                <span class="font-medium text-emerald-700" id="targetNote">Awaiting data</span>
            </div>
        </div>
    </div>
</div>
