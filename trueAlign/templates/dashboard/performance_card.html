<style>
    @keyframes pulse-glow {
        0%,
        100% {
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }
        50% {
            box-shadow: 0 0 16px rgba(34, 197, 94, 0.7);
        }
    }
    .animate-pulse-glow {
        animation: pulse-glow 3s ease-in-out infinite;
    }
</style>

<script>
    document.addEventListener("DOMContentLoaded", function () {
        const canvas = document.getElementById("speedometer");
        if (!canvas) return;

        const ctx = canvas.getContext("2d");
        const percentage = 85;

        function drawSpeedometer() {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            // Clear canvas
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Draw background arc
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0.75 * Math.PI, 0.25 * Math.PI);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.stroke();

            // Draw progress arc
            const startAngle = 0.75 * Math.PI;
            const endAngle = startAngle + 1.5 * Math.PI * (percentage / 100);

            // Create gradient
            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, "#f59e0b"); // amber-500
            gradient.addColorStop(0.5, "#10b981"); // emerald-500
            gradient.addColorStop(1, "#3b82f6"); // blue-500

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.stroke();

            // Draw center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fill();
        }

        // Initial draw
        drawSpeedometer();

        // Animate on hover
        canvas.parentElement.addEventListener("mouseenter", function () {
            let currentPercentage = 0;
            const targetPercentage = percentage;
            const animation = setInterval(function () {
                if (currentPercentage < targetPercentage) {
                    currentPercentage += 2;
                    drawSpeedometerWithPercentage(currentPercentage);
                } else {
                    clearInterval(animation);
                }
            }, 20);
        });

        function drawSpeedometerWithPercentage(perc) {
            const centerX = canvas.width / 2;
            const centerY = canvas.height / 2;
            const radius = Math.min(centerX, centerY) - 20;

            ctx.clearRect(0, 0, canvas.width, canvas.height);

            // Background arc
            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, 0.75 * Math.PI, 0.25 * Math.PI);
            ctx.strokeStyle = "rgba(255, 255, 255, 0.3)";
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.stroke();

            // Progress arc
            const startAngle = 0.75 * Math.PI;
            const endAngle = startAngle + 1.5 * Math.PI * (perc / 100);

            const gradient = ctx.createLinearGradient(0, 0, canvas.width, 0);
            gradient.addColorStop(0, "#f59e0b");
            gradient.addColorStop(0.5, "#10b981");
            gradient.addColorStop(1, "#3b82f6");

            ctx.beginPath();
            ctx.arc(centerX, centerY, radius, startAngle, endAngle);
            ctx.strokeStyle = gradient;
            ctx.lineWidth = 12;
            ctx.lineCap = "round";
            ctx.stroke();

            // Center dot
            ctx.beginPath();
            ctx.arc(centerX, centerY, 8, 0, 2 * Math.PI);
            ctx.fillStyle = "rgba(255, 255, 255, 0.8)";
            ctx.fill();
        }
    });
</script>
