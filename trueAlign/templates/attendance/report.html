{% extends 'base.html' %}
{% load static %}

{% block title %}Attendance Report - TrueAlign{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-6 max-w-5xl mx-auto">
    <!-- Header -->
    <div class="glass-panel p-6 mb-8">
        <h1 class="text-3xl font-bold text-zinc-900 flex items-center gap-3">
            <svg class="w-8 h- text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                    d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                </path>
            </svg>
            Download Attendance Report
        </h1>
        <p class="text-zinc-600 mt-2">Generate and download attendance reports</p>
    </div>

    <!-- Report Form -->
    <div class="glass-panel p-8">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-6">
                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="form-label">From Date <span class="text-red-500">*</span></label>
                        <input type="date" name="from_date" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">To Date <span class="text-red-500">*</span></label>
                        <input type="date" name="to_date" class="form-input" required>
                    </div>
                </div>

                <div>
                    <label class="form-label">Report Format</label>
                    <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mt-2">
                        <div class="interactive-card">
                            <input type="radio" name="format" value="pdf" id="pdf" class="peer hidden" required>
                            <label for="pdf" class="flex items-center gap-3 cursor-pointer">
                                <div
                                    class="w-10 h-10 bg-red-100 rounded-full flex items-center justify-center peer-checked:bg-orange-500">
                                    <svg class="w-5 h-5 text-red-600 peer-checked:text-white" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M7 21h10a2 2 0 002-2V9.414a1 1 0 00-.293-.707l-5.414-5.414A1 1 0 0012.586 3H7a2 2 0 00-2 2v14a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-medium text-zinc-900">PDF</h3>
                                    <p class="text-sm text-zinc-600">Portable format</p>
                                </div>
                            </label>
                        </div>

                        <div class="interactive-card">
                            <input type="radio" name="format" value="excel" id="excel" class="peer hidden">
                            <label for="excel" class="flex items-center gap-3 cursor-pointer">
                                <div
                                    class="w-10 h-10 bg-emerald-100 rounded-full flex items-center justify-center peer-checked:bg-orange-500">
                                    <svg class="w-5 h-5 text-emerald-600 peer-checked:text-white" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M3 10h18M3 14h18m-9-4v8m-7 0h14a2 2 0 002-2V8a2 2 0 00-2-2H5a2 2 0 00-2 2v8a2 2 0 002 2z">
                                        </path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-medium text-zinc-900">Excel</h3>
                                    <p class="text-sm text-zinc-600">Spreadsheet</p>
                                </div>
                            </label>
                        </div>

                        <div class="interactive-card">
                            <input type="radio" name="format" value="csv" id="csv" class="peer hidden">
                            <label for="csv" class="flex items-center gap-3 cursor-pointer">
                                <div
                                    class="w-10 h-10 bg-blue-100 rounded-full flex items-center justify-center peer-checked:bg-orange-500">
                                    <svg class="w-5 h-5 text-blue-600 peer-checked:text-white" fill="none"
                                        stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                            d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                                        </path>
                                    </svg>
                                </div>
                                <div>
                                    <h3 class="font-medium text-zinc-900">CSV</h3>
                                    <p class="text-sm text-zinc-600">Raw data</p>
                                </div>
                            </label>
                        </div>
                    </div>
                </div>

                <div class="flex gap-4 pt-6 border-t border-white/10">
                    <button type="submit" class="flex-1 btn btn-orange">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2"
                                d="M12 10v6m0 0l-3-3m3 3l3-3m2 8H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z">
                            </path>
                        </svg>
                        Download Report
                    </button>
                    <a href="{% url 'attendance:dashboard' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
