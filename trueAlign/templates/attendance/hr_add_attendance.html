{% extends 'base.html' %}
{% load static %}

{% block title %}HR Add Attendance - TrueAlign{% endblock %}

{% block content %}
<div class="px-4 sm:px-6 lg:px-8 py-6 max-w-4xl mx-auto">
    <!-- Header -->
    <div class="glass-panel p-6 mb-8">
        <h1 class="text-3xl font-bold text-zinc-900 flex items-center gap-3">
            <svg class="w-8 h-8 text-orange-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 6v6m0 0v6m0-6h6m-6 0H6">
                </path>
            </svg>
            Add Attendance Manually
        </h1>
        <p class="text-zinc-600 mt-2">Create attendance record for an employee</p>
    </div>

    <!-- Form -->
    <div class="glass-panel p-8">
        <form method="post">
            {% csrf_token %}
            <div class="space-y-6">
                <div>
                    <label class="form-label">Employee <span class="text-red-500">*</span></label>
                    <select name="employee" class="form-input" required>
                        <option value="">Select employee...</option>
                        {% for employee in employees %}
                        <option value="{{ employee.id }}">{{ employee.get_full_name }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="form-label">Date <span class="text-red-500">*</span></label>
                        <input type="date" name="date" class="form-input" required>
                    </div>
                    <div>
                        <label class="form-label">Status <span class="text-red-500">*</span></label>
                        <select name="status" class="form-input" required>
                            <option value="Present">Present</option>
                            <option value="Absent">Absent</option>
                            <option value="Late">Late</option>
                            <option value="On Leave">On Leave</option>
                        </select>
                    </div>
                </div>

                <div class="grid grid-cols-1 md:grid-cols-2 gap-6">
                    <div>
                        <label class="form-label">Check-in Time</label>
                        <input type="time" name="check_in" class="form-input">
                    </div>
                    <div>
                        <label class="form-label">Check-out Time</label>
                        <input type="time" name="check_out" class="form-input">
                    </div>
                </div>

                <div>
                    <label class="form-label">Notes</label>
                    <textarea name="notes" rows="3" class="form-input" placeholder="Optional notes..."></textarea>
                </div>

                <div class="flex gap-4 pt-6 border-t border-white/10">
                    <button type="submit" class="flex-1 btn btn-orange">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7">
                            </path>
                        </svg>
                        Create Record
                    </button>
                    <a href="{% url 'attendance:hr_dashboard' %}" class="btn btn-secondary">Cancel</a>
                </div>
            </div>
        </form>
    </div>
</div>
{% endblock %}
