<!DOCTYPE html>
<html>

<head>
    <style>
        body {
            font-family: "Helvetica", sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #222;
            margin: 0;
            padding: 0;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid #003366;
            padding-bottom: 15px;
            margin-bottom: 30px;
        }

        .logo {
            height: 60px;
            margin-bottom: 10px;
        }

        .company-name {
            font-size: 18pt;
            font-weight: bold;
            color: #003366;
            margin: 0;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .company-details {
            font-size: 9pt;
            color: #555;
            margin-top: 5px;
        }

        .content {
            margin-top: 20px;
            text-align: justify;
            min-height: 400px;
        }

        .footer {
            text-align: center;
            font-size: 8pt;
            color: #777;
            border-top: 1px solid #ccc;
            padding-top: 10px;
            margin-top: 40px;
        }

        strong {
            font-weight: bold;
            color: #000;
        }

        ul {
            margin-left: 20px;
        }

        li {
            margin-bottom: 5px;
        }
    </style>
</head>

<body>
    <div class="header">
        <img src="/static/images/ardurtech.png" class="logo" alt="Ardur Technology">
        <div class="company-name">Ardur Technology Private Limited</div>
        <div class="company-details">
            Reg. Office: 2nd Floor, XYZ Business Plaza, Pune – 411001<br>
            CIN: U72900PN2023PTC123456 | Contact: hr@ardurtech.com | +91 9876543210
        </div>
    </div>

    <div class="content">
        {{ content|safe }}
    </div>

    <div class="footer">
        Ardur Technology Private Limited | www.ardurtech.com | Confidential
    </div>
</body>

</html>
