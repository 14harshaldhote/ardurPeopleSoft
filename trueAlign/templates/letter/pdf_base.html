<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <title>Ardur Technology Letterhead</title>
    <style>
        @page {
            size: A4;
            margin-top: 5cm;
            margin-bottom: 4cm;
            margin-left: 2.5cm;
            margin-right: 2.5cm;
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }

        body {
            font-family: "Helvetica", sans-serif;
            font-size: 11pt;
            line-height: 1.6;
            color: #262626;
            margin: 0;
            padding: 0;
            background-color: white;
        }

        strong {
            font-weight: 600;
            color: #000;
        }

        ul {
            margin-left: 20px;
        }

        li {
            margin-bottom: 5px;
        }

        p {
            margin-bottom: 10px;
            text-align: justify;
        }
    </style>
</head>

<body>
    {{ content|safe }}
</body>

</html>
