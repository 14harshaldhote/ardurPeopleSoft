<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dropdown & Location Test</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdn.jsdelivr.net/npm/remixicon@4.2.0/fonts/remixicon.css" rel="stylesheet">
    <style>
        .shadow-elegant {
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.1), 0 10px 10px -5px rgba(0, 0, 0, 0.04);
        }
        .shadow-elegant-hover {
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.25);
        }
        .backdrop-blur-xl {
            backdrop-filter: blur(20px);
        }
        .backdrop-blur-2xl {
            backdrop-filter: blur(40px);
        }
    </style>
</head>
<body class="bg-gradient-to-br from-blue-50 to-indigo-100 min-h-screen">
    <div class="container mx-auto p-8">
        <h1 class="text-3xl font-bold text-center mb-8 text-gray-800">Dropdown & Location Test</h1>

        <!-- Test Results Display -->
        <div class="bg-white rounded-lg p-6 mb-8 shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Test Results</h2>
            <div id="test-results" class="space-y-2">
                <div class="text-gray-600">Click dropdown and check location detection...</div>
            </div>
        </div>

        <!-- Header with Location and Dropdown -->
        <header class="mb-8 bg-white/80 backdrop-blur-2xl rounded-2xl p-6 shadow-elegant border border-white/40">
            <div class="flex flex-col lg:flex-row justify-between items-start lg:items-center gap-6">
                <div class="space-y-3">
                    <h1 class="font-semibold text-3xl text-gray-800">
                        Good Evening, Test User!
                    </h1>
                    <p class="text-gray-500 text-base">
                        <span id="location-display" class="flex items-center gap-2">
                            <i id="location-icon" class="ri-map-pin-line text-yellow-500 animate-pulse"></i>
                            <span id="location-text">Determining location...</span>
                        </span>
                    </p>
                </div>

                <div class="flex items-center gap-5">
                    <div class="relative">
                        <div id="user-dropdown-toggle" onclick="toggleUserDropdown()" class="flex items-center gap-3 bg-white/60 backdrop-blur-xl px-5 py-3 rounded-xl border border-white/60 shadow-elegant cursor-pointer transition-all duration-200 hover:bg-white/70 hover:shadow-elegant-hover focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2" tabindex="0" aria-haspopup="true" aria-expanded="false">
                            <i class="ri-user-3-line text-xl text-blue-600"></i>
                            <span class="font-medium text-gray-700 text-base">Test User</span>
                            <i class="ri-arrow-down-s-line text-lg text-gray-500 transition-transform duration-200" id="dropdown-arrow"></i>
                        </div>

                        <div id="user-dropdown" class="absolute top-full right-0 mt-2 w-56 bg-white/90 backdrop-blur-xl rounded-xl border border-white/60 shadow-elegant opacity-0 invisible transform -translate-y-2 transition-all duration-300 ease-out z-50">
                            <div class="py-2">
                                <div class="px-4 py-3 border-b border-white/30">
                                    <div class="flex items-center gap-3">
                                        <div class="w-10 h-10 bg-gradient-to-r from-blue-500 to-blue-600 rounded-full flex items-center justify-center">
                                            <span class="text-white font-semibold text-sm">T</span>
                                        </div>
                                        <div>
                                            <p class="font-medium text-gray-800 text-sm">Test User</p>
                                            <p class="text-gray-500 text-xs">test@example.com</p>
                                        </div>
                                    </div>
                                </div>
                                <div class="py-1">
                                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-white/50 transition-colors duration-150">
                                        <i class="ri-lock-password-line text-lg text-blue-600"></i>
                                        <span class="text-sm font-medium">Reset Password</span>
                                    </a>
                                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-gray-700 hover:bg-white/50 transition-colors duration-150">
                                        <i class="ri-user-settings-line text-lg text-gray-600"></i>
                                        <span class="text-sm font-medium">Profile Settings</span>
                                    </a>
                                    <div class="border-t border-white/30 my-1"></div>
                                    <a href="#" class="flex items-center gap-3 px-4 py-3 text-red-600 hover:bg-red-50 transition-colors duration-150">
                                        <i class="ri-logout-box-line text-lg"></i>
                                        <span class="text-sm font-medium">Logout</span>
                                    </a>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </header>

        <!-- Test Controls -->
        <div class="bg-white rounded-lg p-6 shadow-lg">
            <h2 class="text-xl font-semibold mb-4">Test Controls</h2>
            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <button onclick="testDropdown()" class="px-4 py-2 bg-blue-500 text-white rounded-lg hover:bg-blue-600 transition-colors">
                    Test Dropdown Toggle
                </button>
                <button onclick="testLocation()" class="px-4 py-2 bg-green-500 text-white rounded-lg hover:bg-green-600 transition-colors">
                    Test Location Detection
                </button>
                <button onclick="testKeyboard()" class="px-4 py-2 bg-purple-500 text-white rounded-lg hover:bg-purple-600 transition-colors">
                    Test Keyboard Navigation
                </button>
                <button onclick="clearResults()" class="px-4 py-2 bg-gray-500 text-white rounded-lg hover:bg-gray-600 transition-colors">
                    Clear Results
                </button>
            </div>
        </div>
    </div>

    <script>
        // Test Results Logger
        function logResult(message, type = 'info') {
            const resultsDiv = document.getElementById('test-results');
            const timestamp = new Date().toLocaleTimeString();
            const colorClass = type === 'success' ? 'text-green-600' : type === 'error' ? 'text-red-600' : 'text-blue-600';

            const resultDiv = document.createElement('div');
            resultDiv.className = `p-2 border-l-4 border-${type === 'success' ? 'green' : type === 'error' ? 'red' : 'blue'}-500 bg-gray-50 rounded`;
            resultDiv.innerHTML = `<span class="text-xs text-gray-500">[${timestamp}]</span> <span class="${colorClass}">${message}</span>`;

            resultsDiv.appendChild(resultDiv);
            resultsDiv.scrollTop = resultsDiv.scrollHeight;
        }

        // Location Detection Functions
        function getLocationFromIP() {
            const locationIcon = document.getElementById('location-icon');
            const locationText = document.getElementById('location-text');

            if (locationIcon && locationText) {
                locationIcon.className = 'ri-map-pin-line text-blue-500';
                locationText.textContent = 'Getting IP location...';
                logResult('Attempting to get location from IP...', 'info');

                fetch('https://ipapi.co/json/')
                    .then(response => response.json())
                    .then(data => {
                        if (data.city && data.region) {
                            locationIcon.className = 'ri-map-pin-line text-blue-500';
                            locationText.textContent = `${data.city}, ${data.region}`;
                            logResult(`IP location detected: ${data.city}, ${data.region}`, 'success');
                        } else {
                            locationIcon.className = 'ri-map-pin-line text-gray-500';
                            locationText.textContent = 'Location unavailable';
                            logResult('IP location unavailable', 'error');
                        }
                    })
                    .catch(error => {
                        console.warn('IP location error:', error);
                        locationIcon.className = 'ri-map-pin-line text-gray-500';
                        locationText.textContent = 'Location unavailable';
                        logResult(`IP location error: ${error.message}`, 'error');
                    });
            }
        }

        function updateLocationDisplay(position) {
            const locationIcon = document.getElementById('location-icon');
            const locationText = document.getElementById('location-text');

            if (locationIcon && locationText) {
                locationIcon.className = 'ri-map-pin-line text-green-500';
                locationText.textContent = 'Getting location name...';
                logResult('GPS location obtained, fetching address...', 'info');

                fetch(`https://nominatim.openstreetmap.org/reverse?format=json&lat=${position.coords.latitude}&lon=${position.coords.longitude}&zoom=18&addressdetails=1`)
                    .then(response => response.json())
                    .then(data => {
                        const city = data.address.city || data.address.town || data.address.village || '';
                        const state = data.address.state || '';
                        const country = data.address.country || '';

                        let locationName = '';
                        if (city && state) {
                            locationName = `${city}, ${state}`;
                        } else if (city && country) {
                            locationName = `${city}, ${country}`;
                        } else if (state && country) {
                            locationName = `${state}, ${country}`;
                        } else {
                            locationName = 'Location detected';
                        }

                        locationText.textContent = locationName;
                        logResult(`GPS location resolved: ${locationName}`, 'success');
                    })
                    .catch(error => {
                        console.warn('Reverse geocoding error:', error);
                        locationText.textContent = 'Location detected';
                        logResult(`Reverse geocoding error: ${error.message}`, 'error');
                    });
            }
        }

        // Dropdown Functions
        function toggleUserDropdown() {
            const dropdown = document.getElementById('user-dropdown');
            const arrow = document.getElementById('dropdown-arrow');

            if (!dropdown) {
                console.warn('Dropdown element not found');
                logResult('Dropdown element not found', 'error');
                return;
            }

            const isHidden = dropdown.classList.contains('opacity-0');

            if (isHidden) {
                dropdown.classList.remove('opacity-0', 'invisible', '-translate-y-2');
                dropdown.classList.add('opacity-100', 'visible', 'translate-y-0');
                if (arrow) {
                    arrow.classList.add('rotate-180');
                }
                dropdown.setAttribute('aria-hidden', 'false');
                logResult('Dropdown opened', 'success');
            } else {
                dropdown.classList.add('opacity-0', 'invisible', '-translate-y-2');
                dropdown.classList.remove('opacity-100', 'visible', 'translate-y-0');
                if (arrow) {
                    arrow.classList.remove('rotate-180');
                }
                dropdown.setAttribute('aria-hidden', 'true');
                logResult('Dropdown closed', 'success');
            }
        }

        // Test Functions
        function testDropdown() {
            logResult('Testing dropdown functionality...', 'info');
            toggleUserDropdown();
        }

        function testLocation() {
            logResult('Testing location detection...', 'info');

            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(
                    function(position) {
                        logResult('GPS location obtained successfully', 'success');
                        updateLocationDisplay(position);
                    },
                    function(error) {
                        logResult(`GPS location error: ${error.message}`, 'error');
                        getLocationFromIP();
                    },
                    {
                        timeout: 10000,
                        maximumAge: 600000,
                        enableHighAccuracy: true
                    }
                );
            } else {
                logResult('Geolocation not supported, using IP location', 'info');
                getLocationFromIP();
            }
        }

        function testKeyboard() {
            logResult('Testing keyboard navigation...', 'info');
            const toggleButton = document.getElementById('user-dropdown-toggle');
            if (toggleButton) {
                toggleButton.focus();
                logResult('Dropdown toggle focused. Press Enter or Space to toggle.', 'success');
            } else {
                logResult('Toggle button not found', 'error');
            }
        }

        function clearResults() {
            const resultsDiv = document.getElementById('test-results');
            resultsDiv.innerHTML = '<div class="text-gray-600">Results cleared...</div>';
        }

        // Event Listeners
        document.addEventListener('click', function(event) {
            const dropdown = document.getElementById('user-dropdown');
            if (!dropdown) return;

            const userDropdownContainer = dropdown.closest('.relative');
            const isClickOutside = userDropdownContainer && !userDropdownContainer.contains(event.target);
            const isDropdownVisible = !dropdown.classList.contains('opacity-0');

            if (isClickOutside && isDropdownVisible) {
                dropdown.classList.add('opacity-0', 'invisible', '-translate-y-2');
                dropdown.classList.remove('opacity-100', 'visible', 'translate-y-0');
                dropdown.setAttribute('aria-hidden', 'true');

                const arrow = document.getElementById('dropdown-arrow');
                if (arrow) {
                    arrow.classList.remove('rotate-180');
                }
                logResult('Dropdown closed by clicking outside', 'info');
            }
        });

        document.addEventListener('keydown', function(event) {
            if (event.key === 'Escape') {
                const dropdown = document.getElementById('user-dropdown');
                if (!dropdown) return;

                const isDropdownVisible = !dropdown.classList.contains('opacity-0');
                if (isDropdownVisible) {
                    dropdown.classList.add('opacity-0', 'invisible', '-translate-y-2');
                    dropdown.classList.remove('opacity-100', 'visible', 'translate-y-0');
                    dropdown.setAttribute('aria-hidden', 'true');

                    const arrow = document.getElementById('dropdown-arrow');
                    if (arrow) {
                        arrow.classList.remove('rotate-180');
                    }

                    const toggleButton = document.getElementById('user-dropdown-toggle');
                    if (toggleButton) {
                        toggleButton.focus();
                    }
                    logResult('Dropdown closed by Escape key', 'info');
                }
            }
        });

        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            const dropdown = document.getElementById('user-dropdown');
            const toggleButton = document.getElementById('user-dropdown-toggle');

            if (dropdown) {
                dropdown.setAttribute('aria-hidden', 'true');
                dropdown.setAttribute('role', 'menu');
            }

            if (toggleButton) {
                toggleButton.setAttribute('aria-expanded', 'false');
                toggleButton.addEventListener('keydown', function(event) {
                    if (event.key === 'Enter' || event.key === ' ') {
                        event.preventDefault();
                        toggleUserDropdown();
                    }
                });
            }

            logResult('Test page initialized successfully', 'success');
            logResult('Ready for testing!', 'info');

            // Auto-test location on load
            setTimeout(() => {
                testLocation();
            }, 1000);
        });
    </script>
</body>
</html>
